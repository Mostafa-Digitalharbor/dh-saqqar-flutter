<style>
  /* `themeColors: true` in the manifest injects these, so the panel follows
     whichever theme the user's Figma is in without a media query. */
  :root { color-scheme: light dark; }

  body {
    margin: 0;
    padding: 16px;
    font: 12px/1.5 Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #1e1e1e);
    background: var(--figma-color-bg, #fff);
  }

  h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  p  { margin: 0 0 14px; color: var(--figma-color-text-secondary, #666); }

  .drop {
    border: 1px dashed var(--figma-color-border, #d9d9d9);
    border-radius: 8px;
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .drop:hover {
    border-color: var(--figma-color-border-brand-strong, #0d99ff);
    background: var(--figma-color-bg-hover, #f5f5f5);
  }
  .drop strong { display: block; margin-bottom: 3px; font-size: 12px; }
  .drop span { color: var(--figma-color-text-secondary, #666); font-size: 11px; }

  input[type=file] { display: none; }
  .drop + .drop { margin-top: 8px; }

  .opts {
    display: grid;
    gap: 7px;
    margin-top: 14px;
  }
  .opts label {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0 8px;
    align-items: baseline;
    font-size: 12px;
    cursor: pointer;
  }
  .opts input { margin: 0; }
  .opts em {
    grid-column: 2;
    font-style: normal;
    font-size: 11px;
    color: var(--figma-color-text-secondary, #666);
  }

  button {
    width: 100%;
    margin-top: 12px;
    padding: 9px;
    border: 0;
    border-radius: 6px;
    font: inherit;
    font-weight: 600;
    color: var(--figma-color-text-onbrand, #fff);
    background: var(--figma-color-bg-brand, #0d99ff);
    cursor: pointer;
  }
  button:disabled {
    opacity: .4;
    cursor: default;
  }

  #log {
    margin-top: 12px;
    max-height: 190px;
    overflow-y: auto;
    font-size: 11px;
    line-height: 1.7;
  }
  #log div { padding-left: 14px; text-indent: -14px; }
  .warn { color: var(--figma-color-text-warning, #b26a00); }
  .err  { color: var(--figma-color-text-danger, #d32f2f); white-space: pre-wrap; }
  .ok   { color: var(--figma-color-text-success, #2e7d32); font-weight: 600; }
</style>

<h1>Saqqar Design Import</h1>
<p>Pick the <code>design/export</code> folder generated by
   <code>flutter test test/figma_export_test.dart</code>.</p>

<label class="drop" for="picker">
  <strong>Choose folder…</strong>
  <span>tokens.json + one file per screen</span>
</label>
<input id="picker" type="file" webkitdirectory directory multiple>

<!-- Some Figma desktop builds block directory pickers; the multi-file input is
     the fallback that always works. Screenshots need the PNGs selected too,
     which is why the folder picker is the one offered first. -->
<label class="drop" for="files" style="margin-top:8px">
  <strong>…or select the files</strong>
  <span>the .json files, plus png/*.png for screenshots</span>
</label>
<input id="files" type="file" accept=".json,.png" multiple>


<div class="opts">
  <label><input type="checkbox" id="underlay" checked>
    ضع الصورة الحقيقية كمرجع تحت الطبقات
    <em>Screenshot underlay — locked, hide it any time</em></label>
  <label><input type="checkbox" id="only">
    الصور فقط، من غير طبقات
    <em>Screenshots only — nothing editable</em></label>
</div>

<button id="run" type="button" disabled>Import</button>
<div id="log"></div>

<script>
  const log = document.getElementById('log');
  const runButton = document.getElementById('run');
  let payload = null;

  function say(text, className) {
    const line = document.createElement('div');
    if (className) line.className = className;
    line.textContent = text;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function read(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsText(file);
    });
  }

  function readBytes(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const view = new Uint8Array(reader.result);
        // A plain array, not the typed one: Figma's postMessage does not carry
        // typed arrays reliably across the iframe boundary, and `code.js`
        // rebuilds the Uint8Array on the far side.
        const out = new Array(view.length);
        for (let i = 0; i < view.length; i++) out[i] = view[i];
        resolve(out);
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsArrayBuffer(file);
    });
  }

  // Matched on basename, not on the path the JSON records. A directory pick
  // reports `export/png/account.png` while a manual multi-file pick reports
  // just `account.png`, and the plugin has to work with either.
  function basename(pathOrName) {
    return String(pathOrName).split(/[\\/]/).pop();
  }

  // Base64 → a plain number array. Figma's postMessage does not carry typed
  // arrays reliably across the iframe boundary, so the bytes cross as an
  // array and `code.js` rebuilds the Uint8Array on the other side.
  function decodeImages(images) {
    const out = {};
    for (const id of Object.keys(images || {})) {
      const binary = atob(images[id]);
      const bytes = new Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      out[id] = bytes;
    }
    return out;
  }

  async function load(fileList) {
    log.innerHTML = '';
    payload = null;
    runButton.disabled = true;

    const all = Array.from(fileList);
    const files = all.filter((f) => f.name.endsWith('.json'));
    const pngs = all.filter((f) => f.name.toLowerCase().endsWith('.png'));

    if (files.length === 0) {
      say('No .json files in that selection.', 'err');
      return;
    }

    let tokens = null;
    let index = null;
    const byName = {};

    for (const file of files) {
      try {
        const parsed = JSON.parse(await read(file));
        if (file.name === 'tokens.json') tokens = parsed;
        else if (file.name === 'index.json') index = parsed;
        else byName[file.name] = parsed;
      } catch (error) {
        say('Skipped ' + file.name + ' — ' + error.message, 'warn');
      }
    }

    const pngBytes = {};
    for (const file of pngs) {
      try {
        pngBytes[basename(file.name)] = await readBytes(file);
      } catch (error) {
        say('Skipped ' + file.name + ' — ' + error.message, 'warn');
      }
    }

    // `index.json` fixes the order the screens are laid out in. Without it the
    // file list arrives in whatever order the OS gave it, which is usually
    // alphabetical — so the splash would land between Notifications and Usage.
    let screens = [];
    if (index && Array.isArray(index.screens)) {
      for (const entry of index.screens) {
        if (byName[entry.file]) screens.push(byName[entry.file]);
        else say('Missing ' + entry.file, 'warn');
      }
    } else {
      screens = Object.keys(byName).sort().map((k) => byName[k]);
      say('No index.json — importing in filename order.', 'warn');
    }

    let withShots = 0;
    for (const screen of screens) {
      screen.images = decodeImages(screen.images);
      if (screen.screenshot) {
        const bytes = pngBytes[basename(screen.screenshot)];
        if (bytes) {
          screen.screenshotBytes = bytes;
          withShots += 1;
        }
      }
    }

    if (!tokens) say('No tokens.json — screens only, no variables.', 'warn');
    say(screens.length + ' screen(s) ready' + (tokens ? ' + tokens' : '') + '.');

    if (withShots === screens.length && screens.length > 0) {
      say('Screenshots found for all ' + withShots + '.', 'ok');
    } else if (withShots > 0) {
      say('Screenshots for ' + withShots + ' of ' + screens.length + '.', 'warn');
    } else {
      say('No screenshots in this selection — pick the whole export folder ' +
          'so png/ comes along.', 'warn');
    }

    payload = { type: 'import', tokens: tokens, screens: screens };
    runButton.disabled = screens.length === 0 && !tokens;
  }

  document.getElementById('picker').onchange = (e) => load(e.target.files);
  document.getElementById('files').onchange = (e) => load(e.target.files);

  runButton.onclick = () => {
    if (!payload) return;
    runButton.disabled = true;
    say('Importing…');
    parent.postMessage({
      pluginMessage: Object.assign({}, payload, {
        underlay: document.getElementById('underlay').checked,
        screenshotsOnly: document.getElementById('only').checked,
      }),
    }, '*');
  };

  onmessage = (event) => {
    const message = event.data.pluginMessage;
    if (!message) return;

    if (message.type === 'progress') say(message.payload);
    else if (message.type === 'warn') say(message.payload, 'warn');
    else if (message.type === 'error') {
      say(message.payload, 'err');
      runButton.disabled = false;
    } else if (message.type === 'done') {
      const s = message.payload;
      say('Done — ' + s.screens + ' screens, ' + s.layers + ' layers, ' +
          s.variables + ' variables, ' + s.styles + ' styles.', 'ok');
      runButton.disabled = false;
    }
  };
</script>
