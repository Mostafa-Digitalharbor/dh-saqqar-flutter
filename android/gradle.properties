org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# `android.enableJetifier=true` REMOVED (2026-08-18).
#
# Jetifier rewrites every jar and aar on the classpath from the pre-AndroidX
# `com.android.support.*` namespace. Nothing here needs that — the Gradle
# cache resolves zero `com.android.support*` / `android.arch*` artifacts for
# this project, so it was rewriting hundreds of files to change nothing.
#
# It is not free. The transform holds each archive in heap, and the DEBUG
# build feeds it more than release does: debug pulls the x86 and x86_64
# Flutter engine jars for emulators, release only arm. On a CI runner capped
# at -Xmx3G that tipped over as
#     Execution failed for JetifyTransform: x86_64_debug-1.0.0-….jar
#       > Java heap space
# while `bundleRelease` passed at the same cap.
#
# If some future dependency really does need it, the failure is loud and
# obvious — `cannot find symbol: android.support.…` at compile time — not a
# silent misbuild. Re-add the flag then rather than carrying it forever.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
