name: saqqar_app
description: "Saqqar — Odoo Operations Copilot (Mobile)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Fonts (Inter + Tajawal served via google_fonts to avoid bundling now)
  google_fonts: ^6.2.1

  # Icons (Lucide)
  lucide_icons_flutter: ^3.0.0

  # i18n
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  flutter_markdown: ^0.7.7+1

  # Runtime API for the native splash. The `:create` generator stays in
  # dev_dependencies; this dep is just for `FlutterNativeSplash.preserve()`
  # and `.remove()` calls inside main.dart / the in-app splash widget.
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Asset generation. Run, in order:
  #   dart run tool/generate_app_icon.dart   # writes assets/img/saqqar-icon.png
  #   dart run flutter_launcher_icons         # platform launcher icons
  #   dart run flutter_native_splash:create   # native splash screens
  image: ^4.5.4
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/img/

# App-icon generator config. Source: assets/img/saqqar-icon.png — generated
# by `tool/generate_app_icon.dart` so the icon is reproducible from code.
flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/img/saqqar-icon.png'
  adaptive_icon_background: '#030712'
  adaptive_icon_foreground: 'assets/img/saqqar-icon-foreground.png'
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: 'assets/img/saqqar-icon.png'
    background_color: '#030712'
    theme_color: '#06B6D4'

# Splash screen generator config. Dark navy bg + cyan glow, matches the auth
# screen ambient palette. The branding mark sits centered, scaled to ~30%.
flutter_native_splash:
  color: '#030712'
  color_dark: '#030712'
  image: 'assets/img/saqqar-icon-foreground.png'
  image_dark: 'assets/img/saqqar-icon-foreground.png'
  android_12:
    image: 'assets/img/saqqar-icon-foreground.png'
    color: '#030712'
    icon_background_color: '#030712'
  fullscreen: false
  android_gravity: 'center'
  ios_content_mode: 'center'
