name: saqqar_app
description: >
  Saqqar — Odoo Operations Copilot for mobile. AI-powered chat that
  reads, reports on, and acts against your live Odoo environments.
  Built by Digital Harbor (digitalharbor.com.sa).
publish_to: 'none'

# Version naming: `<semver>+<build-code>`. Play Console requires the
# build-code (`+N`) to strictly increase on every upload. Bump
# patch / minor / major following standard semver:
#   • 1.0.0 → 1.0.1 (bug fix), build code 2
#   • 1.0.0 → 1.1.0 (new feature, backwards-compatible), build code 2
#   • 1.0.0 → 2.0.0 (breaking change), build code 2
# The build code is purely an internal counter for Play Store; it
# never needs to match the semver — it just needs to keep growing.
#
# 1.0.2+3 — Tester feedback (2026-05-23):
#   • Multi-file attachments in the chat composer.
#   • Receive ACTION_SEND / ACTION_SEND_MULTIPLE from WhatsApp, Files,
#     Photos — user picks the target chat instead of auto-opening a new one.
#
# 1.2.0+108 — Universal Links (iOS) / App Links (Android): tapping a
#   https://saqqaar.com/... link opens the app on the matching screen
#   (new feature → minor bump). See docs/SAQQAR_DEEP_LINKS_FLUTTER.md.
version: 1.2.0+109

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Cubit + MVVM)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  # Already pulled in transitively by flutter_bloc — direct dep so we
  # can use `ChangeNotifierProvider.value` for non-cubit listenables
  # (e.g. ShareIntakeService).
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.2

  # Universal Links (iOS) / App Links (Android): receives the tapped
  # https://saqqaar.com/... URL on both cold-start and while running, and
  # the existing saqqar:// custom scheme, then routes it via DeepLinks.
  # Chosen over go_router's built-in platform deep-linking because it gives
  # explicit control over the excluded paths (spec §4) and the saqqar://
  # scheme; the engine's own deep-linking is disabled (see
  # AndroidManifest flutter_deeplinking_enabled + Info.plist
  # FlutterDeepLinkingEnabled) so this plugin is the single handler.
  app_links: ^6.3.0

  # Networking
  dio: ^5.7.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Native social sign-in (docs/MOBILE_AUTH_GUIDE.md). google_sign_in is
  # pinned to the v6 API (GoogleSignIn(...).signIn() → authentication.idToken);
  # v7 reworked the surface. The app posts the provider ID token to
  # /api/v1/auth/{google,apple}/ and gets back the same bearer token the
  # email/OTP login returns. sign_in_with_apple is iOS-only in the UI (App
  # Store 4.8 requires Apple when a third-party login is offered).
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # Biometric / device-credential app lock (Face ID, fingerprint, PIN).
  # Gates the app behind the OS authenticator since it holds the user's
  # live Odoo credentials. iOS needs NSFaceIDUsageDescription (Info.plist).
  local_auth: ^2.3.0

  # Push notifications (FCM). firebase_options.dart + the google-services
  # Gradle plugin were generated by `flutterfire configure`. The contract
  # the backend sends against is docs/PUSH_NOTIFICATIONS_BACKEND.md.
  # flutter_local_notifications renders FCM messages while the app is in the
  # FOREGROUND (FCM only auto-shows them in background/terminated).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Fonts (Inter + Tajawal served via google_fonts to avoid bundling now)
  google_fonts: ^6.2.1

  # Icons (Lucide)
  lucide_icons_flutter: ^3.0.0

  # i18n
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  flutter_markdown: ^0.7.7+1

  # Opens markdown links (Odoo record deep-links in assistant replies) in
  # the external browser / Odoo app on tap. Copy-to-clipboard stays as the
  # fallback for non-launchable schemes (Gap G).
  url_launcher: ^6.3.1

  # Runtime API for the native splash. The `:create` generator stays in
  # dev_dependencies; this dep is just for `FlutterNativeSplash.preserve()`
  # and `.remove()` calls inside main.dart / the in-app splash widget.
  flutter_native_splash: ^2.4.3

  # Native file picker for the chat composer's attach button — covers
  # photos, PDFs, Office docs, CSVs (matches the web's `accept` list).
  # Returns file metadata + bytes/path; the chat surfaces just metadata
  # locally and ships bytes to the backend once the attachments API lands.
  file_picker: ^8.1.4

  # Camera capture for the attach sheet's "Camera" row. `file_picker` is
  # PHPicker/SAF-backed and can't reach the camera at all, so shooting a
  # photo straight into a chat needs its own plugin. Gallery + documents
  # still go through `file_picker` above — this is camera-only, which is
  # why no gallery entry point calls it.
  image_picker: ^1.1.2

  # Artifact download + open. `path_provider` gives us the app's
  # documents directory (no runtime permission needed), `open_filex`
  # hands the saved file off to the OS's matching viewer — Adobe PDF,
  # Word, Excel, image gallery, etc. `open_filex` is now the LAST
  # resort: tapping an attachment opens it inside Saqqar (see
  # AttachmentViewerScreen) and only hands off to another app for the
  # kinds we can't render ourselves, or when the user asks explicitly.
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # In-app PDF rendering for the attachment viewer. Backed by the
  # platform renderers already on the device — Android's `PdfRenderer`
  # (API 21+) and iOS `PDFKit`/CoreGraphics — so it adds no bundled
  # engine and needs no new permission on either platform.
  pdfx: ^2.9.1

  # Crash + error reporting. Wired in `main.dart` via `SentryFlutter.init`;
  # the DSN comes from `--dart-define=SAQQAR_SENTRY_DSN=...` so it stays
  # out of source control. When the DSN is missing (e.g. local dev) the
  # SDK quietly no-ops so we never gate boot on a network call.
  sentry_flutter: ^9.22.0

  # Receives Android ACTION_SEND / ACTION_SEND_MULTIPLE intents (and the
  # iOS Share Extension once we ship one) so users can hit "Share → Saqqar"
  # from WhatsApp, Photos, Files, etc. and land in a chat with the file(s)
  # already staged. Wired in `main.dart` — see `ShareIntentBootstrap`.
  receive_sharing_intent: ^1.8.0

  # Outbound share: long-press an agent reply → "Share" → system share
  # sheet (WhatsApp, Mail, Gmail, Files, etc.). Counterpart to
  # receive_sharing_intent above.
  share_plus: ^10.1.2

  # App version/build read at runtime. Feeds Sentry's `release` tag so it
  # tracks pubspec automatically (no hand-edited `saqqar@x.y.z+n` string to
  # drift out of sync on every version bump). Was already present
  # transitively; promoted to a direct dep so `PackageInfo.fromPlatform()`
  # is a supported call site.
  package_info_plus: ^9.0.1

  # Voice input in the chat composer. Records the user's speech to a
  # short m4a/AAC file (mono, 16 kHz, 32 kbps — see SAQQAR_MOBILE_VOICE.md §3),
  # then `POST`s the audio to /api/v1/transcribe/ which proxies to
  # OpenAI Whisper server-side and returns plain transcript text. Replaces
  # the earlier on-device speech_to_text approach so the mobile + web
  # client share the same backend recognizer (consistent accuracy on
  # Arabic / AR↔EN code-switch / dialects).
  record: ^5.1.2
  permission_handler: ^11.3.1

# Pub's resolver picks `record_linux 0.7.2` to satisfy `record ^5.1.2`'s
# constraint, but 0.7.2 predates the `startStream` + `hasPermission(...,
# request:)` additions to `record_platform_interface 1.6.0`. The mismatch
# crashes `flutter build appbundle` on Windows hosts because Linux desktop
# is part of the transitive compile graph even when we only ship Android.
# Pinning to 1.2.1 (the newest that implements the current interface)
# unblocks the build without touching upstream.
dependency_overrides:
  record_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the in-app screenshot harness (tool/screenshots) on a real
  # device/emulator so glassmorphic blur + gradients render at full
  # fidelity (golden tests can't render BackdropFilter). Dev-only.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Asset generation. Run, in order:
  #   dart run tool/generate_app_icon.dart   # writes assets/img/saqqar-icon.png
  #   dart run flutter_launcher_icons         # platform launcher icons
  #   dart run flutter_native_splash:create   # native splash screens
  image: ^4.5.4
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  # Bundled UI faces — the Saqqar Design System uses a single unified
  # Tajawal identity (Arabic + Latin, RTL-first) + JetBrains Mono for code.
  # Bundled (not google_fonts CDN) so they render offline / geo-blocked.
  fonts:
    # Latin/English face — Space Grotesk (variable). Paired with IBM Plex
    # Sans Arabic: Latin glyphs render in Space Grotesk, Arabic falls back to
    # IBM Plex Sans Arabic (see AppTypography.fontFallback). One variable
    # file — Flutter maps `fontWeight` onto its `wght` axis automatically.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    # Arabic face — IBM Plex Sans Arabic (RTL-first), also the Latin fallback.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Kept bundled so we can revert the UI face by flipping AppTypography.fontSans.
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
  config:
    enable-swift-package-manager: false

# App-icon generator config — points at the composed SAQQÂR wordmark
# (navy on a white rounded square, padded inside the tile so it isn't
# crowding the edges). Regenerate with:
#   dart run tool/generate_launcher_icon.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  # Full-bleed dark tile + large symbol (1024²). Adaptive fills the whole
  # launcher shape (no white circle) with the symbol scaled up.
  image_path: 'assets/img/app-icon-full.png'
  adaptive_icon_background: 'assets/img/app-icon-bg.png'
  adaptive_icon_foreground: 'assets/img/app-icon-foreground.png'
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: 'assets/img/app-icon-full.png'
    background_color: '#0b1a38'
    theme_color: '#06B6D4'

# Splash screen generator config. We don't want ANY static branding on
# the splash — the in-app `LaunchSplashScreen` owns the zoom animation
# and should be the first place the wordmark appears.
#
# Android <12: easy — no `image:` means a flat navy screen.
# Android 12+: the OS forces the launcher icon onto the splash (you
#   can't fully suppress it). To make it invisible we feed it a fully
#   transparent PNG (`saqqar-splash-blank.png`) and match the
#   `icon_background_color` to the splash color, so the user sees a
#   solid navy screen instead of a white wordmark in a circle.
#
# Regenerate this asset + the native splash with:
#   dart run tool/generate_blank_splash_icon.dart
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: '#030712'
  color_dark: '#030712'
  android_12:
    image: 'assets/img/saqqar-splash-blank.png'
    image_dark: 'assets/img/saqqar-splash-blank.png'
    color: '#030712'
    icon_background_color: '#030712'
  fullscreen: false
