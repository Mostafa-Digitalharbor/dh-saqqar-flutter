# Static analysis configuration. Documentation: https://dart.dev/lints
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Turn unused imports into errors so dead imports never reach main.
    unused_import: error
    unused_local_variable: error
    # Misclassified parameters waste reviewer time and signal a stale
    # API somewhere — promote to warning so it always shows up in the
    # IDE gutter even when CI is configured to tolerate warnings.
    unused_element: warning
    todo: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Correctness / safety — keep strict, these catch real bugs.
    avoid_dynamic_calls: true
    avoid_print: true # use a proper logger if needed
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    unawaited_futures: true
    use_build_context_synchronously: true
    # Late-stage additions: each one has caught a real bug in this app
    # or a sister project. Cheap to keep on, expensive to debug
    # without. `discarded_futures` is intentionally NOT in this set —
    # it produces noise on every `AnimationController.repeat()` /
    # `.forward()` call in initState (~10 sites). `unawaited_futures`
    # above already catches the higher-signal case of forgotten awaits
    # inside async functions, where the fix is unambiguous.
    noop_primitive_operations: true
    null_check_on_nullable_type_parameter: true
    throw_in_finally: true
    avoid_returning_null_for_void: true
    unrelated_type_equality_checks: true

    # API hygiene
    avoid_empty_else: true
    avoid_returning_this: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    prefer_final_locals: true

    # Performance
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # Style
    avoid_unnecessary_containers: true
    avoid_unused_constructor_parameters: true
    prefer_interpolation_to_compose_strings: true
    sort_child_properties_last: true
    sort_unnamed_constructors_first: true
    unnecessary_lambdas: true
    unnecessary_null_aware_assignments: true
    unnecessary_parenthesis: true
    use_decorated_box: true
    use_super_parameters: true
