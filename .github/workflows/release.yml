name: Release

# Tag-driven, NOT push-driven. Every commit on `saqqar-mostafa` must not
# queue a store review — Play's production review runs hours-to-days and
# Apple's runs ~24 h, so a per-commit pipeline would just build a backlog
# that never drains. Shipping is an explicit act:
#
#   git tag v1.2.5 && git push origin v1.2.5
#
# `workflow_dispatch` is the escape hatch for re-running a build (e.g. a
# flaky upload) or shipping straight to a different track without cutting
# a new tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track (Android). iOS always goes to TestFlight.'
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      platforms:
        description: 'Which platforms to build'
        type: choice
        default: android
        options: [android, ios, both]

concurrency:
  # Never let two releases race — a half-uploaded AAB plus a second
  # in-flight one is how duplicate/skipped version codes happen.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.38.10'

  # `versionCode` must strictly increase on every Play upload, forever.
  # Deriving it from `github.run_number` makes that mechanical instead of
  # a thing a human remembers — but run_number restarts at 1 if this
  # workflow file is ever renamed or deleted, so it is offset past the
  # highest code already on Play (115, shipped from pubspec as 1.2.4+115).
  # If you ever DO rename this file, raise the offset past the last live
  # build code and never lower it.
  #
  # run_number alone is not enough, because it does NOT change when a failed
  # run is re-run — only run_attempt does. Re-running the v1.2.18 release
  # (which is the natural thing to click after a red X) rebuilt versionCode
  # 215 a second time and Play rejected it as already uploaded. Hence the ×10:
  # it leaves nine re-run slots per run and keeps the sequence monotonic.
  # The step below applies both, so codes now climb in steps of ten.
  VERSION_CODE_OFFSET: 200

jobs:
  # ── Gate ──────────────────────────────────────────────────────────────
  # Deliberately duplicated from ci.yml rather than `workflow_call`-ed:
  # ci.yml's build-android job is gated on `github.event_name == 'push'`,
  # which is true for a tag push too, so calling it would also build a
  # throwaway debug APK on every release.
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded

  # ── Resolve the version once, share it with both platform jobs ────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.v.outputs.build_name }}
      build_number: ${{ steps.v.outputs.build_number }}
      has_android: ${{ steps.keys.outputs.has_android }}
      has_ios: ${{ steps.keys.outputs.has_ios }}
    steps:
      # Tags, not just the tip commit: the manual-run branch of the version
      # step reads the newest tag, and the default depth-1 checkout fetches
      # none of them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A platform whose signing secrets are not configured yet must SKIP,
      # not fail. Android and iOS get set up weeks apart in practice, and a
      # permanently-red iOS job trains everyone to ignore the red X — right
      # up to the release where the red X was real. The iOS runner also bills
      # at 10x, so failing it on every tag is expensive noise.
      #
      # This lives in a job output rather than a job-level `if:` because the
      # `secrets` context is NOT available in `jobs.<id>.if` — only `github`,
      # `needs`, `vars` and `inputs` are. Reading them into env here and
      # exporting booleans is the supported way to gate on a secret existing.
      - id: keys
        name: Which platforms are configured?
        env:
          ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IOS_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # if/else, NOT `[[ cond ]] && x=true`.
          #
          # Mid-script that idiom is safe — `set -e` exempts a command
          # followed by `&&`. But as the LAST command of the step it is not:
          # its status becomes the step's exit code, so a false condition
          # fails the step. The first draft ended on
          # `[[ "$ios" == false ]] && echo …`, which exits 1 whenever iOS IS
          # configured. Verified by running all four secret combinations:
          # it passed with iOS unset and failed with iOS set — i.e. it would
          # have looked fine on the Android-only run and broken the day the
          # iOS keys were added, which is the worst possible time to find it.
          if [[ -n "${ANDROID_KEY}" ]]; then android=true; else android=false; fi
          if [[ -n "${IOS_KEY}" ]]; then ios=true; else ios=false; fi

          echo "has_android=$android" >> "$GITHUB_OUTPUT"
          echo "has_ios=$ios"         >> "$GITHUB_OUTPUT"

          {
            echo "### Platforms"
            echo "- Android: \`$android\`"
            echo "- iOS: \`$ios\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$android" == false ]]; then
            echo "- _Android skipped: \`ANDROID_KEYSTORE_BASE64\` is not set._" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$ios" == false ]]; then
            echo "- _iOS skipped: \`APP_STORE_CONNECT_KEY_ID\` is not set._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: v
        name: Derive build name + number
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # v1.2.5 → 1.2.5. Reject anything that is not plain semver so a
            # typo'd tag fails here instead of shipping a bad CFBundleShortVersionString.
            BUILD_NAME="${GITHUB_REF_NAME#v}"
            if [[ ! "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '${GITHUB_REF_NAME}' is not vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
          else
            # Manual run — the newest tag, NOT pubspec.
            #
            # pubspec was the original fallback and it lies: nothing bumps it
            # on a tagged release (the tag supplies the name, CI supplies the
            # number), so it still read 1.2.7 while the shipped train was on
            # 1.2.18. Re-running the iOS job alone — the exact reason this
            # dispatch exists — would have put a build named 1.2.7 on
            # TestFlight, behind everything already there.
            # `|| true` because `pipefail` + `set -e` would kill the step on a
            # repo with no tags, before the friendlier error below can fire.
            BUILD_NAME="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
            if [[ ! "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::No vMAJOR.MINOR.PATCH tag to take a version from — cut a tag, or run this from one" >&2
              exit 1
            fi
            # The code is this branch's HEAD, which may be ahead of that tag.
            # Say so, because the version string will not.
            echo "- Manual run: version \`$BUILD_NAME\` from the newest tag, code from \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          # See VERSION_CODE_OFFSET: ×10 so a re-run of the same run gets its
          # own code instead of colliding with the upload that already failed.
          BUILD_NUMBER=$(( ${{ env.VERSION_CODE_OFFSET }} + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT - 1 ))
          echo "build_name=$BUILD_NAME"     >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "### Release \`$BUILD_NAME+$BUILD_NUMBER\`" >> "$GITHUB_STEP_SUMMARY"

  # ── Android → Play internal track ─────────────────────────────────────
  android:
    name: Android → Play (${{ inputs.track || 'internal' }})
    runs-on: ubuntu-latest
    needs: [verify, version]
    if: >-
      ${{ needs.version.outputs.has_android == 'true'
          && (github.event_name == 'push' || inputs.platforms != 'ios') }}
    steps:
      - uses: actions/checkout@v4

      # Same reason as ci.yml's build-android — and it matters more here,
      # because a release AAB is a bigger build than the debug APK that first
      # hit this. See that job for what the failure actually looks like.
      - name: Free disk space
        run: |
          set -eu
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          echo "--- after ---"; df -h /

      # `android/gradle.properties` asks for `-Xmx8G -XX:MaxMetaspaceSize=4G`
      # — twelve gigabytes for the Gradle JVM alone. That is fine on the
      # maintainer's workstation (a local `bundleRelease` finishes in ~5 min)
      # and impossible here: a private repo's `ubuntu-latest` is 2 vCPU /
      # 7 GB RAM, so the heap cannot even be reserved. The JVM and its Kotlin
      # daemon get OOM-killed part-way through, Gradle exits 143 (SIGTERM),
      # and GitHub reports "The operation was canceled" — which reads like
      # somebody pressed the cancel button rather than an out-of-memory.
      #
      # Written to GRADLE_USER_HOME instead of edited in the repo: that file
      # outranks the project's, so local builds keep their 8 GB and only the
      # runner is constrained. `free -h` is left in so the next memory
      # failure shows numbers rather than a guess.
      - name: Cap Gradle memory for the runner
        run: |
          set -eu
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
          org.gradle.daemon=false
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx1G
          EOF
          free -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `android/app/build.gradle.kts` reads the release keystore out of
      # `android/key.properties` and silently falls back to DEBUG signing
      # when that file is absent. A debug-signed AAB is rejected by Play
      # with a confusing error, so fail loudly here instead.
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to ship a debug-signed bundle" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/saqqar-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=saqqar-release.jks
          EOF

      # Gitignored (it carries the FCM sender identity), but the
      # `com.google.gms.google-services` Gradle plugin hard-fails without it.
      - name: Restore google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GS_JSON}" ]]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set — the google-services Gradle plugin will fail" >&2
            exit 1
          fi
          printf '%s' "$GS_JSON" > android/app/google-services.json

      - run: flutter pub get

      - name: Build app bundle
        env:
          SENTRY_DSN: ${{ secrets.SAQQAR_SENTRY_DSN }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.SAQQAR_GOOGLE_SERVER_CLIENT_ID }}
          WEB_SUBSCRIBE: ${{ vars.SAQQAR_WEB_SUBSCRIBE || 'true' }}
        run: |
          set -euo pipefail
          # `--dart-define=K=` is NOT the same as omitting it.
          # `String.fromEnvironment` falls back to its compiled-in
          # `defaultValue` only when the key is ABSENT; an empty define is a
          # value, and it wins. `SocialAuthConfig.googleServerClientId` ships
          # the real production web client ID as that default, so passing an
          # unset secret through replaced it with '' — which flips
          # `isGoogleConfigured` to false and disables the Google sign-in
          # button. The CI build was breaking a flow that works by default.
          #
          # Only SAQQAR_GOOGLE_SERVER_CLIENT_ID needs this: the other two
          # define `defaultValue: ''` anyway, so an empty pass-through is a
          # no-op for them.
          overrides=()
          if [[ -n "${GOOGLE_SERVER_CLIENT_ID}" ]]; then
            overrides+=("--dart-define=SAQQAR_GOOGLE_SERVER_CLIENT_ID=${GOOGLE_SERVER_CLIENT_ID}")
          else
            echo "SAQQAR_GOOGLE_SERVER_CLIENT_ID unset — keeping the app's built-in default"
          fi
          flutter build appbundle --release \
            --build-name=${{ needs.version.outputs.build_name }} \
            --build-number=${{ needs.version.outputs.build_number }} \
            --no-tree-shake-icons \
            --dart-define=SAQQAR_SENTRY_DSN="${SENTRY_DSN}" \
            --dart-define=SAQQAR_WEB_SUBSCRIBE="${WEB_SUBSCRIBE}" \
            ${overrides[@]+"${overrides[@]}"}

      # Keep the exact artifact that was uploaded. When Play rejects a
      # build you want the bytes it rejected, not a rebuild of the same tag.
      - uses: actions/upload-artifact@v4
        with:
          name: saqqar-${{ needs.version.outputs.build_name }}-${{ needs.version.outputs.build_number }}-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: sa.com.digitalharbor.saqqar
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # `internal` by default and on every tag push. Promoting to
          # production is a deliberate manual step in the Play Console —
          # see docs/RELEASE.md. Saqqar is mid-resubmit after the v15
          # "Broken Functionality" rejection; automating a production
          # push right now would put an unreviewed build in front of the
          # same reviewers who already rejected one.
          track: ${{ inputs.track || 'internal' }}
          status: completed
          # No `mappingFile:` — `isMinifyEnabled = false` in
          # android/app/build.gradle.kts, so R8 never emits mapping.txt.

  # ── iOS → TestFlight ──────────────────────────────────────────────────
  # Runs on macOS, which bills at 10× the Linux minute rate, so it is opt-in
  # on manual runs and only automatic on a real tag.
  ios:
    name: iOS → TestFlight
    # macos-15, not macos-14. `Runner.xcodeproj` contains
    # `PBXFileSystemSynchronizedRootGroup` entries — Xcode 16's synchronized
    # folder groups — and macos-14 defaults to Xcode 15.4, which cannot parse
    # them. It does not fail gracefully either: `xcodebuild -list` trips a
    # DVTAssertions failure ("IDEFileSystemSynchronizedGroupsAreEnabled()")
    # and aborts with signal 6, so `flutter build ios` dies before compiling
    # a single line and the error says nothing about Xcode versions.
    runs-on: macos-15
    needs: [verify, version]
    if: >-
      ${{ needs.version.outputs.has_ios == 'true'
          && (github.event_name == 'push' || inputs.platforms != 'android') }}
    steps:
      - uses: actions/checkout@v4

      # Pin Xcode explicitly rather than trusting the image default: GitHub
      # rolls the default forward (and back) between image releases, and the
      # failure mode when it lands on a version too old for this project is
      # an assertion crash inside `xcodebuild -list`, nowhere near anything
      # that mentions Xcode. Picking the newest 16+ present keeps working as
      # the image ages; the `-version` echo makes the choice visible in the
      # log the next time this breaks.
      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Available:"; ls -d /Applications/Xcode*.app
          # Newest by version sort, then validated — NOT matched by a version
          # glob. Apple went 16.x → 26.x, so a pattern like `Xcode_1[6-9]*`
          # silently skips every current release and falls back to whatever
          # the image default is.
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          # Captured whole, NOT piped through `head`. xcodebuild under Xcode 26
          # aborts on EPIPE: `head -1` closes the pipe after the first line and
          # it dies with an uncaught NSFileHandleOperationException ("Broken
          # pipe") inside -[XcodebuildPreIDEHandler handleVersionWithArguments:],
          # exit 134 — which `pipefail` then turns into a failed step. It had
          # already printed the right version a line earlier, so the failure
          # looked like the selection itself was broken. Parsing a string
          # already in memory cannot close anything early.
          version="$(xcodebuild -version)"
          echo "$version"
          major="${version#Xcode }"
          major="${major%%.*}"
          if [[ "$major" -lt 16 ]]; then
            echo "::error::Xcode $major is too old — Runner.xcodeproj uses synchronized folder groups, which only Xcode 16+ can parse" >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: arm64

      # `bundler-cache: true` keys its cache off `ios/Gemfile.lock`, which is
      # not committed — and committing one generated on the maintainer's
      # Windows box would pin `x64-mingw-ucrt` platforms that a macOS runner
      # then has to `bundle lock --add-platform` its way out of. Resolving on
      # the runner instead costs ~30 s on a 25-minute build and cannot drift.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: ios

      - name: Install fastlane + CocoaPods
        working-directory: ios
        run: bundle install --jobs 4

      # Proves `pod` resolves under the Ruby just put on PATH, before the
      # 20-minute build depends on it. `flutter build ios` runs its own bare
      # `pod install` and, when the two Rubies disagree, only warns —
      #   "CocoaPods is installed but broken. Skipping pod install."
      # — and then fails much later with nothing pointing at Ruby. Failing
      # here costs seconds and names the real problem.
      - name: Verify CocoaPods
        run: |
          set -euo pipefail
          which pod
          pod --version

      - run: flutter pub get

      - name: Build & upload
        working-directory: ios
        env:
          # App Store Connect API key (Users and Access → Integrations →
          # App Store Connect API). Preferred over an Apple ID + app-specific
          # password: no 2FA prompt, and it is scoped/revocable.
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_P8 }}
          # The Apple Distribution certificate, exported from Keychain
          # Access as .p12 and base64'd. Xcode mints the four provisioning
          # profiles itself (-allowProvisioningUpdates), but it will not
          # export a certificate's private key — so the cert is the one
          # piece of signing state we carry. See ios/fastlane/Fastfile.
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          # The Apple DEVELOPMENT certificate, exported the same way. Not a
          # duplicate of the one above and not optional in practice: automatic
          # signing archives with a development identity and only re-signs for
          # the store on export, so a runner without one has Xcode mint a
          # throwaway certificate per build. Eleven of those in three days is
          # what put the team over Apple's certificate cap and failed v1.2.17.
          IOS_DEV_CERT_P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
          BUILD_NAME: ${{ needs.version.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          SAQQAR_SENTRY_DSN: ${{ secrets.SAQQAR_SENTRY_DSN }}
          SAQQAR_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.SAQQAR_GOOGLE_SERVER_CLIENT_ID }}
        run: bundle exec fastlane beta

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saqqar-${{ needs.version.outputs.build_name }}-${{ needs.version.outputs.build_number }}-ios-logs
          path: |
            ios/build/*.ipa
            ~/Library/Logs/gym
          retention-days: 30
          if-no-files-found: ignore
