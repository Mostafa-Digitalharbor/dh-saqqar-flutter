name: CI

on:
  push:
    branches: [main, master, 'saqqar-*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Show Flutter / Dart versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # NO formatting gate. `dart format` rewrites 269 of the repo's 373
      # Dart files, so `--set-exit-if-changed` fails on every commit and
      # takes `build-android` (and the release workflow, which reuses this
      # job) down with it via `needs:`. Reformatting the tree to satisfy it
      # would turn every future one-line fix into a several-hundred-file
      # diff and destroy `git blame`, so the gate goes rather than the code.
      # `flutter analyze` below is the real quality bar.

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    # Only run on push to a long-lived branch, not on every PR.
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub's ubuntu image leaves ~14 GB free, and this build wants more
      # once Gradle unpacks the NDK (~1 GB), CMake, and its transform cache
      # on top of the Flutter SDK. Running out does NOT surface as "no space
      # left on device" — Gradle reports it as
      #   Could not add entry '…/transforms/…' to cache file-access.bin
      # which reads like a corrupt cache and sends you looking in the wrong
      # place. Dropping toolchains this build never touches buys ~15 GB.
      # `df` brackets it so the next failure shows a number instead of a guess.
      - name: Free disk space
        run: |
          set -eu
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          echo "--- after ---"; df -h /

      # Same override as the release workflow — see its "Cap Gradle memory"
      # step for why the repo's own 8 GB heap cannot run on a hosted runner.
      # The debug APK is the smaller build, but it comes off the same 7 GB.
      - name: Cap Gradle memory for the runner
        run: |
          set -eu
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
          org.gradle.daemon=false
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx1G
          EOF
          free -h

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      # `android/app/google-services.json` is gitignored (it carries the FCM
      # sender identity), but `com.google.gms.google-services` is applied
      # unconditionally in android/app/build.gradle.kts, so EVERY Android
      # build — debug included — hard-fails without it:
      #   > File google-services.json is missing. The Google Services Plugin
      #   > cannot function without it.
      # Same restore as the release workflow. Fails with a readable message
      # rather than leaving the Gradle error to be decoded.
      - name: Restore google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${GS_JSON}" ]]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set — no Android build can run without it" >&2
            exit 1
          fi
          printf '%s' "$GS_JSON" > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saqqar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
